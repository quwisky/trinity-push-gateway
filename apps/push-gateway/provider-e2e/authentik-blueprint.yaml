version: 1
metadata:
  name: Trinity Push Gateway provider compatibility
entries:
  - id: gateway-operators
    model: authentik_core.group
    identifiers:
      name: gateway-operators
    attrs:
      is_superuser: false

  - id: gateway-allowed-user
    model: authentik_core.user
    identifiers:
      username: gateway-allowed
    attrs:
      email: gateway-allowed@example.test
      groups:
        - !KeyOf gateway-operators
      is_active: true
      name: Gateway Allowed Operator
      password: !Env AUTHENTIK_GATEWAY_ALLOWED_PASSWORD
      type: internal

  - id: gateway-denied-user
    model: authentik_core.user
    identifiers:
      username: gateway-denied
    attrs:
      email: gateway-denied@example.test
      is_active: true
      name: Gateway Denied Operator
      password: !Env AUTHENTIK_GATEWAY_DENIED_PASSWORD
      type: internal

  - id: gateway-oidc-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Trinity Push Gateway
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      client_id: !Env AUTHENTIK_GATEWAY_CLIENT_ID
      client_secret: !Env AUTHENTIK_GATEWAY_CLIENT_SECRET
      client_type: confidential
      grant_types:
        - authorization_code
      include_claims_in_id_token: true
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      issuer_mode: per_provider
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: http://127.0.0.1:3000/admin/auth/callback
        - matching_mode: strict
          redirect_uri_type: logout
          url: http://127.0.0.1:3000/admin/
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]

  - model: authentik_core.application
    identifiers:
      slug: trinity-push-gateway
    attrs:
      name: Trinity Push Gateway
      provider: !KeyOf gateway-oidc-provider
