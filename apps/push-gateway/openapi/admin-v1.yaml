openapi: 3.1.2
info:
  title: Trinity Push Gateway Operator API
  version: 1.0.0
  description: |-
    Same-origin API for the self-hosted Push Gateway UI. The API exposes only
    privacy-preserving operational summaries and bounded operator actions. It
    never returns Matrix identifiers, Push Keys, Account Routes, notification
    content, Client Installation identifiers, provider tokens, secret values,
    credential paths, raw identity-provider claims, or client IP chains.

    Browser authentication is deliberately outside this versioned API. Its
    fixed routes are `GET /admin/auth/login`, `GET /admin/auth/callback`, and
    `POST /admin/auth/logout`. The logout route has the same exact-Origin and
    XSRF requirements as API mutations.

    The API is same-origin only. It does not support CORS and does not emit CORS
    response headers. Every operation requires the host-only, HttpOnly
    `TRINITY_ADMIN_SESSION` cookie. Every mutation additionally requires an
    `Origin` header that exactly matches the configured public origin and an
    `X-XSRF-TOKEN` header matching the session-bound value in the readable
    `TRINITY_ADMIN_XSRF` cookie.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /admin/api/v1
    description: Same-origin self-hosted administration API
security:
  - operatorSession: []
tags:
  - name: Session
    description: Current Operator Identity and Operator Session.
  - name: Overview
    description: Bounded operational status summaries.
  - name: Metrics
    description: Fixed-cardinality, privacy-preserving aggregate metrics.
  - name: Configuration
    description: Effective non-secret configuration and secret presence only.
  - name: Security
    description: Operator Sessions and Operator Audit Entries.
  - name: Operations
    description: Bounded, synchronous operator actions and backup metadata.
paths:
  /session:
    get:
      tags:
        - Session
      summary: Get the current Operator Session
      description: |-
        Returns the authenticated Operator Identity and current Operator Session.
        No cookie value, XSRF value, provider token, or raw provider claim is
        returned in the document.
      operationId: getSession
      responses:
        '200':
          description: Current Operator Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /overview:
    get:
      tags:
        - Overview
      summary: Get the operational overview
      description: |-
        Returns last-observed delivery readiness, current administration
        request readiness, storage use, fixed 24-hour aggregates, and the most
        recent bounded-operation summaries. The overview never probes delivery
        storage and contains no per-request or per-Client Installation data.
      operationId: getOverview
      responses:
        '200':
          description: Privacy-preserving operational overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /metrics:
    get:
      tags:
        - Metrics
      summary: Get aggregate metrics
      description: |-
        Returns the two fixed metric families over a bounded UTC half-open range:
        Notification Request outcomes and actual FCM attempts. `from` and `to`
        are optional together. Omitting both selects the 24 hours ending at the
        request time. Supplying only one, selecting an empty or reversed range,
        or selecting more than 30 days returns `invalid_request`. Buckets contain
        no labels or identifiers beyond the fixed outcome and platform sets.
      operationId: getMetrics
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - $ref: '#/components/parameters/MetricsInterval'
      responses:
        '200':
          description: Aggregate metrics for the effective range and interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /configuration:
    get:
      tags:
        - Configuration
      summary: Get effective safe configuration
      description: |-
        Returns an explicit allowlist of effective non-secret settings. Secret
        entries disclose only whether a value is configured and whether its
        source is an environment value or a mounted file. Secret values, raw
        environment variables, credential paths, Firebase client email, and
        trusted-proxy networks are never returned. Effective database and backup
        locations are intentionally visible to an authenticated Gateway Operator.
        Configuration is read-only; this API has no configuration mutation operation.
      operationId: getConfiguration
      responses:
        '200':
          description: Effective privacy-safe configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /audit-entries:
    get:
      tags:
        - Security
      summary: List Operator Audit Entries
      description: |-
        Lists a stable, privacy-safe audit projection in reverse chronological
        order. `from` and `to` are optional together and describe a UTC half-open
        range. Omitting both selects the 24 hours ending at the initial request
        time. Supplying only one, selecting an empty or reversed range, or
        selecting more than 90 days returns `invalid_request`.

        `cursor` is opaque and binds the effective time range, kind, outcome,
        and page size. Clients must not inspect or modify it. A cursor used with
        different filters, an expired cursor, or a malformed cursor returns
        `invalid_request`. Entries never contain correlation identifiers, IP
        addresses or chains, raw claims, Matrix data, or notification data.
      operationId: listAuditEntries
      parameters:
        - $ref: '#/components/parameters/AuditCursor'
        - $ref: '#/components/parameters/AuditLimit'
        - $ref: '#/components/parameters/AuditEntryKindFilter'
        - $ref: '#/components/parameters/AuditEntryOutcomeFilter'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: One bounded page of Operator Audit Entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditEntryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /sessions:
    get:
      tags:
        - Security
      summary: List active Operator Sessions
      description: |-
        Returns the bounded deployment-wide set of active Operator Sessions.
        Session identifiers are opaque management identifiers; raw cookies,
        provider tokens, raw claims, user agents, and client addresses are not
        returned.
      operationId: listSessions
      responses:
        '200':
          description: Active Operator Sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /sessions/{sessionId}:
    delete:
      tags:
        - Security
      summary: Revoke an Operator Session
      description: |-
        Revokes exactly one active Operator Session. Revoking the current
        session also clears its browser session and XSRF cookies. The request
        requires the session cookie, an exact configured `Origin`, and an
        `X-XSRF-TOKEN` value matching the session-bound `TRINITY_ADMIN_XSRF`
        cookie. The server performs no CORS negotiation.
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Operator Session revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MutationForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /backups:
    get:
      tags:
        - Operations
      summary: List verified gateway backups
      description: |-
        Lists bounded metadata for verified gateway-database backups. The API
        exposes no filesystem path, download, restore, deletion, overwrite, or
        arbitrary database capability.
      operationId: listBackups
      responses:
        '200':
          description: Verified backup metadata, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
    post:
      tags:
        - Operations
      summary: Create and verify a gateway backup
      description: |-
        Runs one synchronous, isolated gateway-database backup with a 120-second
        deadline and a one-hour cooldown. The operation uses a strict generated
        name, refuses overwrite and configured count/byte limit excess, and
        returns only verified metadata. It never creates an administration
        database backup and exposes no arbitrary path or database selection.

        The request requires the session cookie, an exact configured `Origin`,
        and an `X-XSRF-TOKEN` value matching the session-bound
        `TRINITY_ADMIN_XSRF` cookie. The server performs no CORS negotiation.
      operationId: createBackup
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '201':
          description: Backup created and integrity-verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MutationForbidden'
        '409':
          $ref: '#/components/responses/OperationInProgress'
        '429':
          $ref: '#/components/responses/CooldownActive'
        '500':
          $ref: '#/components/responses/OutcomeUnknown'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
        '504':
          $ref: '#/components/responses/OperationTimeout'
        '507':
          $ref: '#/components/responses/BackupLimitExceeded'
  /operations/cleanup:
    post:
      tags:
        - Operations
      summary: Run gateway cleanup
      description: |-
        Runs one synchronous, isolated cleanup with a 30-second deadline and a
        five-minute cooldown. This fixed operation does not expose a database,
        filesystem, process, command, or retention-policy parameter.

        The request requires the session cookie, an exact configured `Origin`,
        and an `X-XSRF-TOKEN` value matching the session-bound
        `TRINITY_ADMIN_XSRF` cookie. The server performs no CORS negotiation.
      operationId: runCleanup
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Cleanup completed with a known outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MutationForbidden'
        '409':
          $ref: '#/components/responses/OperationInProgress'
        '429':
          $ref: '#/components/responses/CooldownActive'
        '500':
          $ref: '#/components/responses/OutcomeUnknown'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
        '504':
          $ref: '#/components/responses/OperationTimeout'
  /operations/firebase-validation:
    post:
      tags:
        - Operations
      summary: Validate Firebase access
      description: |-
        Performs one synchronous `validate_only` credential, project, and FCM
        API-access check with a synthetic non-deliverable target, a 20-second
        deadline, and a one-minute cooldown. This is not an end-to-end delivery
        test and sends no Notification Request or Delivery Message.

        The request requires the session cookie, an exact configured `Origin`,
        and an `X-XSRF-TOKEN` value matching the session-bound
        `TRINITY_ADMIN_XSRF` cookie. The server performs no CORS negotiation.
      operationId: validateFirebase
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Firebase validation completed with a known outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MutationForbidden'
        '409':
          $ref: '#/components/responses/OperationInProgress'
        '429':
          $ref: '#/components/responses/CooldownActive'
        '500':
          $ref: '#/components/responses/OutcomeUnknown'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
        '504':
          $ref: '#/components/responses/OperationTimeout'
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: TRINITY_ADMIN_SESSION
      description: |-
        Opaque host-only, Secure, HttpOnly, SameSite=Strict Operator Session
        cookie. Its value is never returned in an API document.
  parameters:
    # BEGIN GENERATED METRICS PARAMETERS
    MetricsFrom:
      name: 'from'
      in: 'query'
      required: false
      description: 'Inclusive UTC start of the metrics range. `from` and `to` must either both be omitted or both be supplied. The maximum range is 30 days.'
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    MetricsTo:
      name: 'to'
      in: 'query'
      required: false
      description: 'Exclusive UTC end of the metrics range. `from` and `to` must either both be omitted or both be supplied. The maximum range is 30 days.'
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    MetricsInterval:
      name: 'interval'
      in: 'query'
      required: false
      description: 'UTC aggregation interval. Defaults to `hour`.'
      schema:
        $ref: '#/components/schemas/MetricsInterval'
    # END GENERATED METRICS PARAMETERS
    # BEGIN GENERATED AUDIT PARAMETERS
    AuditCursor:
      name: 'cursor'
      in: 'query'
      required: false
      description: 'Opaque continuation cursor from `nextCursor`. It binds every effective filter and must be replayed without interpretation or modification.'
      schema:
        type: 'string'
        minLength: 1
        maxLength: 2048
    AuditLimit:
      name: 'limit'
      in: 'query'
      required: false
      description: 'Maximum entries in the page. Defaults to 50 and cannot exceed 100.'
      schema:
        type: 'integer'
        minimum: 1
        maximum: 100
        default: 50
    AuditEntryKindFilter:
      name: 'kind'
      in: 'query'
      required: false
      description: 'Include only entries with this fixed audit-entry kind.'
      schema:
        $ref: '#/components/schemas/AuditEntryKind'
    AuditEntryOutcomeFilter:
      name: 'outcome'
      in: 'query'
      required: false
      description: 'Include only entries with this fixed audit outcome.'
      schema:
        $ref: '#/components/schemas/AuditEntryOutcome'
    AuditFrom:
      name: 'from'
      in: 'query'
      required: false
      description: 'Inclusive UTC start of the audit range. `from` and `to` must either both be omitted or both be supplied. The maximum range is 90 days.'
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    AuditTo:
      name: 'to'
      in: 'query'
      required: false
      description: 'Exclusive UTC end of the audit range. `from` and `to` must either both be omitted or both be supplied. The maximum range is 90 days.'
      schema:
        $ref: '#/components/schemas/UtcTimestamp'
    # END GENERATED AUDIT PARAMETERS
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Opaque Operator Session identifier returned by this API.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Origin:
      name: Origin
      in: header
      required: true
      description: |-
        Browser-supplied origin. The server compares its scheme, host, and port
        exactly with the configured public origin and never infers it from a
        forwarded header.
      schema:
        type: string
        format: uri
        minLength: 8
        maxLength: 2048
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |-
        Exact session-bound value from the readable `TRINITY_ADMIN_XSRF`
        cookie. The value is not returned in a JSON response.
      schema:
        type: string
        minLength: 16
        maxLength: 1024
  headers:
    RetryAfter:
      description: Whole seconds until the action may be attempted again.
      schema:
        type: integer
        minimum: 0
        maximum: 86400
  responses:
    # BEGIN GENERATED ADMIN PROBLEM RESPONSES
    InvalidRequest:
      description: 'Request parameters are invalid (`invalid_request`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/invalid_request'
                  title:
                    const: 'Invalid request'
                  status:
                    const: 400
                  code:
                    const: 'invalid_request'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    Unauthenticated:
      description: 'The Operator Session is absent, invalid, revoked, or expired (`unauthenticated`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/unauthenticated'
                  title:
                    const: 'Authentication required'
                  status:
                    const: 401
                  code:
                    const: 'unauthenticated'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    Forbidden:
      description: 'The authenticated Operator Identity is not permitted (`forbidden`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/forbidden'
                  title:
                    const: 'Forbidden'
                  status:
                    const: 403
                  code:
                    const: 'forbidden'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    MutationForbidden:
      description: 'The Operator Identity is forbidden (`forbidden`), or exact-Origin or XSRF validation failed (`csrf_failed`).'
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: 'object'
                    properties:
                      type:
                        const: '/admin/problems/forbidden'
                      title:
                        const: 'Forbidden'
                      status:
                        const: 403
                      code:
                        const: 'forbidden'
                    required:
                      - 'type'
                      - 'title'
                      - 'status'
                      - 'code'
              - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: 'object'
                    properties:
                      type:
                        const: '/admin/problems/csrf_failed'
                      title:
                        const: 'Request validation failed'
                      status:
                        const: 403
                      code:
                        const: 'csrf_failed'
                    required:
                      - 'type'
                      - 'title'
                      - 'status'
                      - 'code'
    NotFound:
      description: 'The requested fixed resource does not exist (`not_found`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/not_found'
                  title:
                    const: 'Not found'
                  status:
                    const: 404
                  code:
                    const: 'not_found'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    OperationInProgress:
      description: 'A mutually exclusive maintenance action is already running (`operation_in_progress`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/operation_in_progress'
                  title:
                    const: 'Operation already in progress'
                  status:
                    const: 409
                  code:
                    const: 'operation_in_progress'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    CooldownActive:
      description: 'The action is still in its fixed cooldown (`cooldown_active`).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/cooldown_active'
                  title:
                    const: 'Operation cooldown active'
                  status:
                    const: 429
                  code:
                    const: 'cooldown_active'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    OutcomeUnknown:
      description: 'The action executed but its final audit state could not be persisted; clients must not retry automatically (`outcome_unknown`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/outcome_unknown'
                  title:
                    const: 'Operation outcome unknown'
                  status:
                    const: 500
                  code:
                    const: 'outcome_unknown'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    AdminUnavailable:
      description: 'The isolated administration subsystem is unavailable (`admin_unavailable`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/admin_unavailable'
                  title:
                    const: 'Administration unavailable'
                  status:
                    const: 503
                  code:
                    const: 'admin_unavailable'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    OperationTimeout:
      description: 'The bounded action exceeded its fixed deadline (`operation_timeout`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/operation_timeout'
                  title:
                    const: 'Operation timed out'
                  status:
                    const: 504
                  code:
                    const: 'operation_timeout'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    BackupLimitExceeded:
      description: 'The configured backup count or byte limit prevents another backup; operator intervention is required (`backup_limit_exceeded`).'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'object'
                properties:
                  type:
                    const: '/admin/problems/backup_limit_exceeded'
                  title:
                    const: 'Backup limit exceeded'
                  status:
                    const: 507
                  code:
                    const: 'backup_limit_exceeded'
                required:
                  - 'type'
                  - 'title'
                  - 'status'
                  - 'code'
    # END GENERATED ADMIN PROBLEM RESPONSES
  schemas:
    # BEGIN GENERATED OPERATOR SESSION CONTRACT
    UtcTimestamp:
      type: 'string'
      format: 'date-time'
      pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
      description: 'RFC 3339 timestamp normalized to UTC and ending in `Z`.'
    OpaqueId:
      type: 'string'
      pattern: '^[A-Za-z0-9_-]{16,128}$'
      description: 'Opaque identifier with no client-meaningful structure.'
    OperatorIdentity:
      type: 'object'
      properties:
        issuer:
          type: 'string'
          maxLength: 2048
          format: 'uri'
          description: 'Exact identity-provider issuer for this Operator Identity.'
        subject:
          type: 'string'
          minLength: 1
          maxLength: 512
          description: 'Provider-local subject for this Operator Identity.'
        displayName:
          type: 'string'
          minLength: 1
          maxLength: 256
          description: 'Optional display label copied from the current accepted identity claims.'
        email:
          type: 'string'
          minLength: 3
          maxLength: 320
          format: 'email'
