services:
  gateway:
    environment:
      TRINITY_PUSH_GATEWAY_ADMIN_BACKUP_DIRECTORY: /data/backups
      TRINITY_PUSH_GATEWAY_ADMIN_DATABASE_PATH: /data/admin.sqlite
      TRINITY_PUSH_GATEWAY_ADMIN_ENABLED: ${TRINITY_PUSH_GATEWAY_ADMIN_ENABLED:-true}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_CLIENT_ID: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_CLIENT_ID:?set TRINITY_PUSH_GATEWAY_ADMIN_OIDC_CLIENT_ID}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_CLIENT_SECRET_FILE: /run/secrets/admin_oidc_client_secret
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_GROUP_CLAIM: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_GROUP_CLAIM:-groups}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_ISSUER: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_ISSUER:?set TRINITY_PUSH_GATEWAY_ADMIN_OIDC_ISSUER}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_REQUIRED_GROUP: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_REQUIRED_GROUP:?set TRINITY_PUSH_GATEWAY_ADMIN_OIDC_REQUIRED_GROUP}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_SCOPES: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_SCOPES:-openid profile email groups}
      TRINITY_PUSH_GATEWAY_ADMIN_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_basic}
      TRINITY_PUSH_GATEWAY_ADMIN_PUBLIC_ORIGIN: ${TRINITY_PUSH_GATEWAY_ADMIN_PUBLIC_ORIGIN:?set TRINITY_PUSH_GATEWAY_ADMIN_PUBLIC_ORIGIN}
      TRINITY_PUSH_GATEWAY_ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
    secrets:
      - admin_oidc_client_secret
      - admin_session_secret

secrets:
  admin_oidc_client_secret:
    file: ${TRINITY_PUSH_GATEWAY_ADMIN_OIDC_CLIENT_SECRET_FILE:-./secrets/admin_oidc_client_secret}
  admin_session_secret:
    file: ${TRINITY_PUSH_GATEWAY_ADMIN_SESSION_SECRET_FILE:-./secrets/admin_session_secret}
