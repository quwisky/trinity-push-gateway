name: Container

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  IMAGE_NAME: ghcr.io/quwisky/trinity-push-gateway

jobs:
  affected:
    name: Detect affected projects
    if: inputs.release_tag == ''
    outputs:
      push_gateway: ${{ steps.projects.outputs.push_gateway }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: master
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect affected projects
        id: projects
        shell: bash
        run: |
          set -Eeuo pipefail
          affected_projects="$(
            pnpm nx show projects \
              --affected \
              --base="$NX_BASE" \
              --head="$NX_HEAD"
          )"
          if grep --extended-regexp --line-regexp --quiet \
            'push-gateway(-ui)?' <<<"$affected_projects"; then
            printf 'push_gateway=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'The gateway or its bundled UI is affected; container validation is required.'
          else
            printf 'push_gateway=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'push-gateway is not affected; container validation is a no-op.'
          fi

  container:
    name: container
    if: always() && inputs.release_tag == ''
    needs: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful affected detection
        if: needs.affected.result != 'success'
        run: |
          printf '%s\n' 'Affected-project detection failed; container validation cannot continue.'
          exit 1
      - name: Report unaffected gateway
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway != 'true'
        run: printf '%s\n' 'push-gateway is not affected; no container build is required.'
      - name: Check out repository
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install Bun
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate disabled and administration Compose configurations
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        env:
          TRINITY_PUSH_GATEWAY_ANDROID_APP_ID: example.android
          TRINITY_PUSH_GATEWAY_IOS_APP_ID: example.ios
        run: |
          set -Eeuo pipefail
          docker compose -f compose.yml config --quiet
          docker compose \
            --env-file .env.self-host-admin.example \
            -f compose.yml \
            -f compose.admin.yml \
            config --quiet
      - name: Set up Docker Buildx
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build AMD64 image
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/push-gateway/Dockerfile
          load: true
          platforms: linux/amd64
          tags: trinity-push-gateway:check
      - name: Report unpacked and check compressed image size
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        run: |
          unpacked_bytes=$(docker image inspect trinity-push-gateway:check --format '{{.Size}}')
          docker save trinity-push-gateway:check | gzip -1 > "$RUNNER_TEMP/gateway-image.tar.gz"
          compressed_bytes=$(stat --format=%s "$RUNNER_TEMP/gateway-image.tar.gz")
          echo "Unpacked image: $unpacked_bytes bytes"
          echo "Compressed image: $compressed_bytes bytes"
          test "$compressed_bytes" -le 157286400
      - name: Smoke test assembled container contracts
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        run: apps/push-gateway/scripts/container-smoke.sh trinity-push-gateway:check
      - name: Benchmark administration isolation
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        run: NX_DAEMON=false pnpm nx run push-gateway:benchmark-admin-isolation --skipNxCache
      - name: Upload redacted benchmark evidence
        if: >-
          always() &&
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: admin-isolation-benchmark-${{ github.run_id }}
          path: test-output/benchmarks/admin-isolation.md
          retention-days: 14

  publication-dry-run:
    name: publication graph (no push)
    if: always() && inputs.release_tag == ''
    needs: affected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful affected detection
        if: needs.affected.result != 'success'
        run: |
          printf '%s\n' 'Affected-project detection failed; publication validation cannot continue.'
          exit 1
      - name: Report unaffected gateway
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway != 'true'
        run: printf '%s\n' 'push-gateway is not affected; no publication graph is required.'
      - name: Check out repository
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the attested multi-platform publication graph without pushing
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.push_gateway == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/push-gateway/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/gateway-multiarch.tar
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: false
          sbom: true
          tags: trinity-push-gateway:publication-dry-run

  publish:
    if: inputs.release_tag != ''
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest
      - name: Find an existing immutable release image
        id: existing
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if image_digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish multi-platform image
        id: publish
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/push-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Add image digest to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          if ! grep --fixed-strings --quiet "$IMAGE_NAME@$IMAGE_DIGEST" "$RUNNER_TEMP/release-notes.md"; then
            printf '\n\nContainer image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
