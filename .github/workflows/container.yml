name: Container

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/quwisky/trinity-push-gateway

jobs:
  container:
    name: container
    if: inputs.release_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build AMD64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          platforms: linux/amd64
          tags: trinity-push-gateway:check
      - name: Report unpacked and check compressed image size
        run: |
          unpacked_bytes=$(docker image inspect trinity-push-gateway:check --format '{{.Size}}')
          docker save trinity-push-gateway:check | gzip -1 > "$RUNNER_TEMP/gateway-image.tar.gz"
          compressed_bytes=$(stat --format=%s "$RUNNER_TEMP/gateway-image.tar.gz")
          echo "Unpacked image: $unpacked_bytes bytes"
          echo "Compressed image: $compressed_bytes bytes"
          test "$compressed_bytes" -le 157286400
      - name: Smoke test container health
        run: |
          docker run --detach --name gateway-smoke \
            --cap-drop ALL \
            --init \
            --read-only \
            --publish 127.0.0.1:3000:3000 \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --env TRINITY_PUSH_GATEWAY_ANDROID_APP_ID=example.android \
            --env TRINITY_PUSH_GATEWAY_IOS_APP_ID=example.ios \
            --env TRINITY_PUSH_GATEWAY_FCM_CLIENT_EMAIL=gateway@example.test \
            --env TRINITY_PUSH_GATEWAY_FCM_PRIVATE_KEY=test-private-key \
            --env TRINITY_PUSH_GATEWAY_FCM_PROJECT_ID=example-project \
            --env TRINITY_PUSH_GATEWAY_FINGERPRINT_KEY=test-fingerprint-key-32-bytes-long \
            --mount type=volume,destination=/data \
            trinity-push-gateway:check
          trap 'docker rm --force gateway-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs gateway-smoke
          exit 1

  publication-dry-run:
    name: publication graph (no push)
    if: inputs.release_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the attested multi-platform publication graph without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/gateway-multiarch.tar
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: false
          sbom: true
          tags: trinity-push-gateway:publication-dry-run

  publish:
    if: inputs.release_tag != ''
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest
      - name: Find an existing immutable release image
        id: existing
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if image_digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish multi-platform image
        id: publish
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
      - name: Add image digest to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          if ! grep --fixed-strings --quiet "$IMAGE_NAME@$IMAGE_DIGEST" "$RUNNER_TEMP/release-notes.md"; then
            printf '\n\nContainer image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
