name: Release

# release-please keeps one release PR open on main with the version bump and CHANGELOG.md.
# Merging that PR makes it tag the merge commit and publish the GitHub release, and the
# deploy job below ships the Worker in the same run.
#
# The release PR and the tag come from the release GitHub App's token, not GITHUB_TOKEN:
# pushes made with GITHUB_TOKEN trigger no workflows, so CI would never run on the release
# PR. The deploy job lives in this workflow for the same reason. A tag pushed with
# GITHUB_TOKEN would start no separate deploy workflow.
on:
  push:
    branches: [main]

# One group for every release run. Never cancel mid-flight: a half-finished deploy is
# worse than a slow one. A newer queued push replaces an older one, losing nothing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's private key lives only in this environment. The workflow token keeps the
    # top-level read-only permissions; the App opens the PR and creates the tag and release.
    environment: release-app
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Contents for the release commits, tag and release; pull-requests for the release
      # PR, its labels and its comment.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only in the run that created a release, so each deploy matches exactly one
  # release. FCM_SERVICE_ACCOUNT lives in Cloudflare (wrangler secret put), never in GitHub.
  deploy:
    name: Deploy the Worker
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run gateway:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
