name: Provider compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:
    inputs:
      provider:
        description: Real provider gate to run
        required: true
        default: all
        type: choice
        options:
          - all
          - pocket-id
          - authentik

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: Classify provider gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deterministic: ${{ steps.gates.outputs.deterministic }}
      image: ${{ steps.gates.outputs.image }}
      plan: ${{ steps.gates.outputs.plan }}
      provider_matrix: ${{ steps.gates.outputs.provider_matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select required gates
        id: gates
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PROVIDER: ${{ inputs.provider }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node apps/push-gateway/provider-e2e/provider-gate-workflow.mjs select

  deterministic:
    name: Deterministic OIDC provider
    if: needs.classify.outputs.deterministic == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic Pocket ID and Authentik profiles
        run: NX_DAEMON=false pnpm nx run push-gateway:test-oidc-provider --skipNxCache

  image:
    name: Build provider-test image
    if: needs.classify.outputs.image == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build assembled AMD64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/push-gateway/Dockerfile
          load: true
          platforms: linux/amd64
          tags: trinity-push-gateway:provider-gate
      - name: Export assembled image
        run: docker save trinity-push-gateway:provider-gate | gzip -1 > "$RUNNER_TEMP/provider-image.tar.gz"
      - name: Upload assembled image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          compression-level: 0
          name: provider-image-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-image.tar.gz
          retention-days: 1

  providers:
    name: ${{ matrix.displayName }} ${{ github.sha }}
    if: needs.classify.outputs.image == 'true'
    needs: [classify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.provider_matrix) }}
    env:
      PROVIDER_GATE_IMAGE: trinity-push-gateway:provider-gate
      PROVIDER_GATE_PROVIDER: ${{ matrix.id }}
      PROVIDER_GATE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install browser gate dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Download assembled image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-image-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-image
      - name: Load assembled image
        run: gzip --decompress --stdout "$RUNNER_TEMP/provider-image/provider-image.tar.gz" | docker load
      - name: Run the provider lifecycle
        env:
          PROVIDER_GATE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/provider-evidence
          PROVIDER_GATE_WORK_DIRECTORY: ${{ runner.temp }}/provider-credentials
        run: NX_DAEMON=false pnpm nx run push-gateway:provider-gate --skipNxCache
      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: ${{ matrix.id }}-provider-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-evidence
          retention-days: 14
      - name: Clean provider gate
        if: always()
        env:
          PROVIDER_GATE_EVIDENCE_DIRECTORY: ${{ runner.temp }}/provider-evidence
          PROVIDER_GATE_OPERATION: cleanup
          PROVIDER_GATE_WORK_DIRECTORY: ${{ runner.temp }}/provider-credentials
        run: NX_DAEMON=false pnpm nx run push-gateway:provider-gate --skipNxCache

  release-gates:
    name: release-gates
    if: always()
    needs: [classify, deterministic, image, providers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected provider gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PROVIDERS_RESULT: ${{ needs.providers.result }}
          PROVIDER_PLAN: ${{ needs.classify.outputs.plan }}
        run: node apps/push-gateway/provider-e2e/provider-gate-workflow.mjs require
